<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIA FabLab Slot Booking Portal</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-[#FBFBFA] text-zinc-900 font-sans antialiased selection:bg-zinc-200">
  <div id="root"></div>

  <!-- Native ES Modules: 100% compatible with GitHub Pages without Babel compile delays or module errors -->
  <script type="module">
    import { h, render } from 'https://esm.sh/preact@10.19.6';
    import { useState, useEffect, useMemo } from 'https://esm.sh/preact@10.19.6/hooks';
    import htm from 'https://esm.sh/htm@3.1.1';

    // Bind htm to Preact's createElement
    const html = htm.bind(h);

    // --- MACHINES CONFIGURATION ---
    const MACHINES = [
      {
        id: 'laser-cutter',
        name: 'Laser Cutting Machine',
        type: 'Laser Cutter',
        slotDuration: '1 hour',
        tagline: 'Precision 2D cutting & engraving'
      },
      {
        id: '3d-printer',
        name: '3D Printing Machine',
        type: '3D Printer',
        slotDuration: '1 hour',
        tagline: 'Additive 3D rapid prototyping'
      }
    ];

    const ONE_HOUR_SLOTS = [
      '08:00 AM - 09:00 AM',
      '09:00 AM - 10:00 AM',
      '10:00 AM - 11:00 AM',
      '11:00 AM - 12:00 PM',
      '12:00 PM - 01:00 PM',
      '01:00 PM - 02:00 PM',
      '02:00 PM - 03:00 PM',
      '03:00 PM - 04:00 PM',
      '04:00 PM - 05:00 PM',
      '05:00 PM - 06:00 PM',
      '05:30 PM - 06:30 PM',
    ];

    const SEMESTER_OPTIONS = [
      'B.Arch Sem 1',
      'B.Arch Sem 2',
      'B.Arch Sem 3',
      'B.Arch Sem 4',
      'B.Arch Sem 5',
      'B.Arch Sem 6',
      'B.Arch Sem 7',
      'B.Arch Sem 8',
      'B.Arch Sem 9',
      'B.Arch Sem 10',
      'M.Arch'
    ];

    function getOffsetDateString(offsetDays) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return d.toISOString().split('T')[0];
    }

    function formatDateDisplay(isoDate) {
      if (!isoDate) return '';
      const date = new Date(isoDate + 'T00:00:00');
      return date.toLocaleDateString('en-US', {
        weekday: 'short',
        month: 'short',
        day: 'numeric'
      });
    }

    const INITIAL_BOOKINGS = [
      {
        id: 'NIA-LC-102',
        token: 'NIA-LC-102',
        machineId: 'laser-cutter',
        machineName: 'Laser Cutting Machine',
        studentName: 'Ananya Shenoy',
        semester: 'B.Arch Sem 6',
        date: getOffsetDateString(0),
        timeSlot: '09:00 AM - 10:00 AM',
        status: 'Confirmed',
        createdAt: Date.now() - 3600000 * 3
      },
      {
        id: 'NIA-3D-204',
        token: 'NIA-3D-204',
        machineId: '3d-printer',
        machineName: '3D Printing Machine',
        studentName: 'Rohan Hegde',
        semester: 'B.Arch Sem 8',
        date: getOffsetDateString(0),
        timeSlot: '02:00 PM - 03:00 PM',
        status: 'Confirmed',
        createdAt: Date.now() - 3600000 * 2
      },
      {
        id: 'NIA-LC-105',
        token: 'NIA-LC-105',
        machineId: 'laser-cutter',
        machineName: 'Laser Cutting Machine',
        studentName: 'Mohammed Zaid',
        semester: 'B.Arch Sem 4',
        date: getOffsetDateString(1),
        timeSlot: '11:00 AM - 12:00 PM',
        status: 'Confirmed',
        createdAt: Date.now() - 3600000
      }
    ];

    // SVG Icons
    const ScissorsIcon = () => html`
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
        <circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/>
      </svg>
    `;

    const PrinterIcon = () => html`
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
        <polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>
      </svg>
    `;

    const CalendarIcon = () => html`
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
    `;

    const ClockIcon = () => html`
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
    `;

    const CheckIcon = () => html`
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 text-emerald-400">
        <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/>
      </svg>
    `;

    const UserIcon = () => html`
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 text-zinc-400">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
    `;

    const LockIcon = () => html`
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5 text-zinc-500">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    `;

    const PencilIcon = () => html`
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5">
        <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
      </svg>
    `;

    const TrashIcon = () => html`
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5">
        <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      </svg>
    `;

    function App() {
      const [activeTab, setActiveTab] = useState('book');
      const [selectedMachine, setSelectedMachine] = useState(MACHINES[0]);
      const [bookings, setBookings] = useState(() => {
        const saved = localStorage.getItem('nia_fablab_bookings');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return INITIAL_BOOKINGS;
      });

      // 7-day quick date picker
      const dateOptions = useMemo(() => {
        return [0, 1, 2, 3, 4, 5, 6].map((offset) => {
          const iso = getOffsetDateString(offset);
          const date = new Date(iso + 'T00:00:00');
          return {
            iso,
            label: date.toLocaleDateString('en-US', { weekday: 'short' }),
            dayNum: date.getDate(),
            month: date.toLocaleDateString('en-US', { month: 'short' })
          };
        });
      }, []);

      const [selectedDate, setSelectedDate] = useState(dateOptions[0].iso);
      const [selectedSlot, setSelectedSlot] = useState('');
      const [formData, setFormData] = useState({ name: '', semester: 'B.Arch Sem 4' });
      const [formErrors, setFormErrors] = useState({});
      const [searchQuery, setSearchQuery] = useState('');
      const [successModalData, setSuccessModalData] = useState(null);

      // Admin states
      const [isAdmin, setIsAdmin] = useState(false);
      const [showAdminModal, setShowAdminModal] = useState(false);
      const [adminPassword, setAdminPassword] = useState('');
      const [adminError, setAdminError] = useState('');

      const [editingBooking, setEditingBooking] = useState(null);
      const [editForm, setEditForm] = useState({ studentName: '', semester: '', machineId: '', date: '', timeSlot: '' });
      const [editError, setEditError] = useState('');
      const [deleteBookingTarget, setDeleteBookingTarget] = useState(null);

      // Cross-tab and live sync broadcast channel (works natively on GitHub Pages with zero setup)
      useEffect(() => {
        let broadcast;
        try {
          broadcast = new BroadcastChannel('nia_fablab_sync');
          broadcast.onmessage = (event) => {
            if (event.data && event.data.type === 'SYNC_BOOKINGS') {
              setBookings(event.data.bookings);
            }
          };
        } catch (e) {
          // ignore if unsupported
        }

        return () => {
          if (broadcast) broadcast.close();
        };
      }, []);

      const syncUpdate = (updatedList) => {
        setBookings(updatedList);
        try {
          localStorage.setItem('nia_fablab_bookings', JSON.stringify(updatedList));
          const broadcast = new BroadcastChannel('nia_fablab_sync');
          broadcast.postMessage({ type: 'SYNC_BOOKINGS', bookings: updatedList });
          broadcast.close();
        } catch (e) {}
      };

      const isSlotBooked = (slot, date, machineId, excludeId = null) => {
        return bookings.some(
          (b) => b.machineId === machineId && b.date === date && b.timeSlot === slot && b.id !== excludeId
        );
      };

      const handleSlotSelect = (slot) => {
        if (isSlotBooked(slot, selectedDate, selectedMachine.id)) return;
        setSelectedSlot(slot);
      };

      const handleSubmitBooking = (e) => {
        e.preventDefault();
        const errors = {};
        if (!formData.name.trim()) errors.name = 'Please enter your full name';
        if (!selectedSlot) errors.slot = 'Please select an available 1-hour slot';

        if (Object.keys(errors).length > 0) {
          setFormErrors(errors);
          return;
        }

        if (isSlotBooked(selectedSlot, selectedDate, selectedMachine.id)) {
          setFormErrors({ slot: 'This slot was just reserved. Please pick another.' });
          return;
        }

        setFormErrors({});
        const prefix = selectedMachine.id === 'laser-cutter' ? 'NIA-LC' : 'NIA-3D';
        const randomToken = `${prefix}-${Math.floor(100 + Math.random() * 900)}`;

        const newBooking = {
          id: randomToken,
          token: randomToken,
          machineId: selectedMachine.id,
          machineName: selectedMachine.name,
          studentName: formData.name.trim(),
          semester: formData.semester,
          date: selectedDate,
          timeSlot: selectedSlot,
          status: 'Confirmed',
          createdAt: Date.now()
        };

        const updated = [newBooking, ...bookings];
        syncUpdate(updated);

        setSuccessModalData(newBooking);
        setSelectedSlot('');
        setFormData({ name: '', semester: 'B.Arch Sem 4' });
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPassword === 'admin564') {
          setIsAdmin(true);
          setShowAdminModal(false);
          setAdminPassword('');
          setAdminError('');
        } else {
          setAdminError('Invalid admin password.');
        }
      };

      const handleSaveEdit = (e) => {
        e.preventDefault();
        if (!editForm.studentName.trim()) {
          setEditError('Student name cannot be empty.');
          return;
        }
        if (isSlotBooked(editForm.timeSlot, editForm.date, editForm.machineId, editingBooking.id)) {
          setEditError('This slot is already reserved.');
          return;
        }

        const machineObj = MACHINES.find((m) => m.id === editForm.machineId);
        const updated = bookings.map((b) =>
          b.id === editingBooking.id
            ? {
                ...b,
                studentName: editForm.studentName.trim(),
                semester: editForm.semester,
                machineId: editForm.machineId,
                machineName: machineObj ? machineObj.name : b.machineName,
                date: editForm.date,
                timeSlot: editForm.timeSlot
              }
            : b
        );

        syncUpdate(updated);
        setEditingBooking(null);
      };

      const handleDeleteBooking = (id) => {
        const updated = bookings.filter((b) => b.id !== id);
        syncUpdate(updated);
        setDeleteBookingTarget(null);
      };

      const filteredBookings = useMemo(() => {
        const q = searchQuery.toLowerCase().trim();
        if (!q) return bookings;
        return bookings.filter(
          (b) =>
            b.studentName.toLowerCase().includes(q) ||
            b.token.toLowerCase().includes(q) ||
            b.machineName.toLowerCase().includes(q) ||
            b.semester.toLowerCase().includes(q)
        );
      }, [bookings, searchQuery]);

      return html`
        <div class="min-h-screen bg-[#FBFBFA] text-zinc-900 flex flex-col font-sans antialiased selection:bg-zinc-200">
          <!-- INSTITUTION TOP NAVIGATION -->
          <header class="bg-white border-b border-zinc-200 sticky top-0 z-40">
            <div class="max-w-6xl mx-auto px-3.5 sm:px-6">
              <div class="flex items-center justify-between min-h-16 py-2 gap-2">
                <!-- Logo & Institute Name -->
                <div class="flex items-center space-x-2.5 sm:space-x-3 min-w-0">
                  <div class="w-9 h-9 sm:w-10 sm:h-10 shrink-0 rounded-xl bg-zinc-900 text-white flex items-center justify-center font-bold text-xs sm:text-sm tracking-wider shadow-xs">
                    NIA
                  </div>
                  <div class="truncate">
                    <div class="flex items-center gap-1.5 flex-wrap">
                      <h1 class="font-semibold text-zinc-900 tracking-tight text-xs sm:text-base truncate">
                        Nitte Institute of Architecture
                      </h1>
                      <span class="hidden md:inline-block px-2 py-0.5 text-[10px] sm:text-[11px] font-medium bg-zinc-100 text-zinc-600 rounded-md border border-zinc-200">
                        FabLab
                      </span>
                    </div>
                    <div class="flex items-center gap-2">
                      <p class="text-[10px] sm:text-xs text-zinc-500 truncate">Digital Lab Slot Booking</p>
                      <span class="inline-flex items-center gap-1 text-[10px] text-emerald-700 bg-emerald-50 border border-emerald-200 px-1.5 py-0.2 rounded-full font-medium">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                        Live
                      </span>
                    </div>
                  </div>
                </div>

                <!-- Navigation Tabs & Admin -->
                <div class="flex items-center space-x-1.5 shrink-0">
                  <div class="flex items-center bg-zinc-100 p-1 rounded-xl border border-zinc-200/80">
                    <button
                      onClick=${() => setActiveTab('book')}
                      class="px-2.5 sm:px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all ${
                        activeTab === 'book' ? 'bg-white text-zinc-900 shadow-xs' : 'text-zinc-600 hover:text-zinc-900'
                      }"
                    >
                      Book
                    </button>
                    <button
                      onClick=${() => setActiveTab('schedule')}
                      class="px-2.5 sm:px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium transition-all ${
                        activeTab === 'schedule' ? 'bg-white text-zinc-900 shadow-xs' : 'text-zinc-600 hover:text-zinc-900'
                      }"
                    >
                      Schedule
                    </button>
                  </div>

                  ${isAdmin
                    ? html`
                        <div class="flex items-center space-x-1 bg-amber-50 border border-amber-200 text-amber-900 px-2 sm:px-3 py-1.5 rounded-xl text-xs font-medium">
                          <span class="hidden sm:inline">Admin</span>
                          <button onClick=${() => setIsAdmin(false)} title="Logout Admin" class="text-amber-700 hover:text-rose-600 ml-1">
                            ✕
                          </button>
                        </div>
                      `
                    : html`
                        <button
                          onClick=${() => setShowAdminModal(true)}
                          class="flex items-center space-x-1 p-2 sm:px-3 sm:py-2 rounded-xl text-xs font-medium text-zinc-600 hover:text-zinc-900 border border-zinc-200 hover:border-zinc-300 hover:bg-zinc-50 transition"
                          title="Admin Access"
                        >
                          <${LockIcon} />
                          <span class="hidden sm:inline">Admin</span>
                        </button>
                      `}
                </div>
              </div>
            </div>
          </header>

          <!-- LAB TIMINGS BANNER -->
          <div class="bg-zinc-50 border-b border-zinc-200/70 py-2">
            <div class="max-w-6xl mx-auto px-3.5 sm:px-6 flex flex-wrap items-center justify-between gap-1.5 text-[11px] sm:text-xs text-zinc-600">
              <div class="flex items-center space-x-2">
                <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
                <span class="font-semibold text-zinc-800">Lab Timings:</span>
                <span>Mon–Sun 08:00 AM – 06:30 PM (1-Hour Slots)</span>
              </div>
              <div class="text-zinc-500">
                <span>Room FAB-02, Ground Floor</span>
              </div>
            </div>
          </div>

          <!-- MAIN BODY -->
          <main class="flex-1 max-w-6xl w-full mx-auto px-3.5 sm:px-6 py-5 sm:py-8">
            ${activeTab === 'book'
              ? html`
                  <div class="space-y-6 sm:space-y-8">
                    <div>
                      <div class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md bg-stone-100 border border-stone-200 text-stone-700 text-[11px] font-mono uppercase tracking-wider mb-1.5">
                        1-Hour Slots
                      </div>
                      <h2 class="text-xl sm:text-2xl md:text-3xl font-light text-zinc-900 tracking-tight">
                        Reserve your slot in <span class="font-semibold">3 simple steps</span>
                      </h2>
                      <p class="mt-1 text-xs sm:text-sm text-zinc-500">
                        Choose machine, pick available time slot, and confirm your name.
                      </p>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 items-start">
                      <!-- STEP 1 & 2 -->
                      <div class="lg:col-span-7 space-y-5 sm:space-y-6">
                        <!-- Step 1: Select Machine -->
                        <div class="bg-white rounded-2xl p-4 sm:p-5 border border-zinc-200/90 shadow-xs">
                          <div class="flex items-center justify-between mb-3">
                            <span class="text-[11px] font-semibold uppercase tracking-wider text-zinc-400">Step 01</span>
                            <span class="text-xs font-medium text-zinc-600">Select Machine</span>
                          </div>

                          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                            ${MACHINES.map((machine) => {
                              const isSelected = selectedMachine.id === machine.id;
                              return html`
                                <button
                                  key=${machine.id}
                                  type="button"
                                  onClick=${() => {
                                    setSelectedMachine(machine);
                                    setSelectedSlot('');
                                  }}
                                  class="min-h-[46px] flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-medium border transition-all touch-manipulation ${
                                    isSelected
                                      ? 'bg-zinc-900 text-white border-zinc-900 shadow-xs'
                                      : 'bg-white text-zinc-800 border-zinc-200 hover:border-zinc-400 hover:bg-zinc-50'
                                  }"
                                >
                                  <span class="flex items-center gap-2.5 truncate pr-2">
                                    <span class="p-1.5 rounded-lg shrink-0 ${isSelected ? 'bg-zinc-800 text-white' : 'bg-zinc-100 text-zinc-700'}">
                                      ${machine.id === 'laser-cutter' ? html`<${ScissorsIcon} />` : html`<${PrinterIcon} />`}
                                    </span>
                                    <span class="font-semibold truncate">${machine.name}</span>
                                  </span>
                                  <span class="text-[11px] shrink-0 font-medium">
                                    ${isSelected ? html`<${CheckIcon} />` : html`<span class="text-zinc-400">Choose</span>`}
                                  </span>
                                </button>
                              `;
                            })}
                          </div>
                        </div>

                        <!-- Step 2: Date & Slots -->
                        <div class="bg-white rounded-2xl p-4 sm:p-6 border border-zinc-200/90 shadow-xs">
                          <div class="flex items-center justify-between mb-3.5">
                            <span class="text-[11px] font-semibold uppercase tracking-wider text-zinc-400">Step 02</span>
                            <span class="text-xs font-medium text-zinc-600">Pick Date & Time</span>
                          </div>

                          <!-- Date selector -->
                          <div class="mb-5">
                            <div class="flex items-center justify-between mb-2 flex-wrap gap-2">
                              <label class="text-xs font-medium text-zinc-700 flex items-center gap-1.5">
                                <${CalendarIcon} />
                                <span>Select Booking Date</span>
                              </label>
                              <input
                                type="date"
                                min=${getOffsetDateString(0)}
                                value=${selectedDate}
                                onChange=${(e) => {
                                  setSelectedDate(e.target.value);
                                  setSelectedSlot('');
                                }}
                                class="text-xs font-medium text-zinc-800 bg-zinc-100 px-2 py-1 rounded-lg border border-zinc-200 cursor-pointer"
                              />
                            </div>

                            <div class="flex sm:grid sm:grid-cols-7 gap-2 overflow-x-auto pb-2 pt-0.5 no-scrollbar snap-x touch-pan-x">
                              ${dateOptions.map((item) => {
                                const isSelected = selectedDate === item.iso;
                                return html`
                                  <button
                                    key=${item.iso}
                                    type="button"
                                    onClick=${() => {
                                      setSelectedDate(item.iso);
                                      setSelectedSlot('');
                                    }}
                                    class="shrink-0 w-20 sm:w-auto rounded-xl p-2.5 text-center border transition-all ${
                                      isSelected
                                        ? 'border-zinc-900 bg-zinc-900 text-white shadow-xs'
                                        : 'border-zinc-200 hover:border-zinc-300 hover:bg-zinc-50 text-zinc-800'
                                    }"
                                  >
                                    <span class="block text-[10px] uppercase tracking-wider ${isSelected ? 'text-zinc-300' : 'text-zinc-400'}">${item.label}</span>
                                    <span class="block text-base sm:text-lg font-semibold my-0.5">${item.dayNum}</span>
                                    <span class="block text-[10px] ${isSelected ? 'text-zinc-300' : 'text-zinc-500'}">${item.month}</span>
                                  </button>
                                `;
                              })}
                            </div>
                          </div>

                          <!-- 1-Hour Time Slots -->
                          <div>
                            <div class="flex items-center justify-between mb-2 text-xs font-medium text-zinc-700">
                              <span>Slots for ${formatDateDisplay(selectedDate)}</span>
                              <div class="flex items-center gap-2 text-[10px] text-zinc-500">
                                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-white border border-zinc-300"></span> Open</span>
                                <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-zinc-300"></span> Reserved</span>
                              </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-64 sm:max-h-72 overflow-y-auto pr-1">
                              ${ONE_HOUR_SLOTS.map((slot) => {
                                const booked = isSlotBooked(slot, selectedDate, selectedMachine.id);
                                const isChosen = selectedSlot === slot;
                                return html`
                                  <button
                                    key=${slot}
                                    type="button"
                                    disabled=${booked}
                                    onClick=${() => handleSlotSelect(slot)}
                                    class="min-h-[44px] flex items-center justify-between px-3 py-2 rounded-xl text-xs font-medium border transition-all ${
                                      booked
                                        ? 'bg-zinc-100 text-zinc-400 border-zinc-200 cursor-not-allowed line-through'
                                        : isChosen
                                        ? 'bg-zinc-900 text-white border-zinc-900 shadow-xs'
                                        : 'bg-white text-zinc-800 border-zinc-200 hover:border-zinc-400 hover:bg-zinc-50'
                                    }"
                                  >
                                    <span class="flex items-center gap-2">
                                      <${ClockIcon} />
                                      <span>${slot}</span>
                                    </span>
                                    <span class="text-[10px] font-semibold">${booked ? 'Reserved' : isChosen ? 'Selected' : 'Open'}</span>
                                  </button>
                                `;
                              })}
                            </div>
                            ${formErrors.slot && html`<p class="mt-2 text-xs text-rose-600">${formErrors.slot}</p>`}
                          </div>
                        </div>
                      </div>

                      <!-- STEP 3: Student Details Form -->
                      <div class="lg:col-span-5">
                        <div class="bg-white rounded-2xl p-4 sm:p-6 border border-zinc-200/90 shadow-xs lg:sticky lg:top-24">
                          <div class="flex items-center justify-between mb-3.5">
                            <span class="text-[11px] font-semibold uppercase tracking-wider text-zinc-400">Step 03</span>
                            <span class="text-xs font-medium text-zinc-600">Student Details</span>
                          </div>

                          <form onSubmit=${handleSubmitBooking} class="space-y-4 text-xs">
                            <div class="p-3 rounded-xl bg-zinc-50 border border-zinc-200/80 space-y-1.5">
                              <div class="flex justify-between">
                                <span class="text-zinc-500">Machine:</span>
                                <span class="font-semibold text-zinc-800">${selectedMachine.name}</span>
                              </div>
                              <div class="flex justify-between">
                                <span class="text-zinc-500">Date:</span>
                                <span class="font-medium text-zinc-800">${formatDateDisplay(selectedDate)}</span>
                              </div>
                              <div class="flex justify-between items-center">
                                <span class="text-zinc-500">Slot:</span>
                                <span class="font-medium text-zinc-900 text-right">
                                  ${selectedSlot || html`<span class="text-amber-600 italic">Select slot on left</span>`}
                                </span>
                              </div>
                            </div>

                            <div>
                              <label class="block font-medium text-zinc-700 mb-1">Full Name *</label>
                              <div class="relative">
                                <input
                                  type="text"
                                  value=${formData.name}
                                  onInput=${(e) => setFormData({ ...formData, name: e.target.value })}
                                  placeholder="Enter your full name"
                                  class="w-full min-h-[44px] px-3.5 py-2 text-sm rounded-xl border border-zinc-200 focus:outline-none focus:border-zinc-900"
                                />
                              </div>
                              ${formErrors.name && html`<p class="mt-1 text-[11px] text-rose-500">${formErrors.name}</p>`}
                            </div>

                            <div>
                              <label class="block font-medium text-zinc-700 mb-1">Semester *</label>
                              <select
                                value=${formData.semester}
                                onChange=${(e) => setFormData({ ...formData, semester: e.target.value })}
                                class="w-full min-h-[44px] px-3.5 py-2 text-sm rounded-xl border border-zinc-200 bg-white focus:outline-none focus:border-zinc-900"
                              >
                                ${SEMESTER_OPTIONS.map((s) => html`<option key=${s} value=${s}>${s}</option>`)}
                              </select>
                            </div>

                            <button
                              type="submit"
                              class="w-full min-h-[46px] mt-2 py-3 px-4 bg-zinc-900 hover:bg-zinc-800 active:scale-[0.99] text-white rounded-xl text-sm font-medium tracking-wide transition shadow-xs"
                            >
                              Confirm & Reserve Slot
                            </button>
                          </form>
                        </div>
                      </div>
                    </div>
                  </div>
                `
              : html`
                  <!-- SCHEDULE VIEW -->
                  <div class="space-y-5 sm:space-y-6">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                      <div>
                        <h2 class="text-xl sm:text-2xl font-semibold text-zinc-900 tracking-tight">
                          Live Queue & Bookings
                        </h2>
                        <p class="text-xs sm:text-sm text-zinc-500">All registered slots at NIA FabLab</p>
                      </div>

                      <div class="relative w-full sm:w-72">
                        <input
                          type="text"
                          value=${searchQuery}
                          onInput=${(e) => setSearchQuery(e.target.value)}
                          placeholder="Search student or token..."
                          class="w-full min-h-[42px] px-3.5 py-2 text-xs sm:text-sm rounded-xl border border-zinc-200 bg-white focus:outline-none focus:border-zinc-900"
                        />
                      </div>
                    </div>

                    <div class="bg-white rounded-2xl border border-zinc-200/80 shadow-xs overflow-hidden">
                      <div class="px-4 sm:px-6 py-3.5 border-b border-zinc-100 flex items-center justify-between">
                        <span class="font-semibold text-xs text-zinc-800 uppercase tracking-wider">
                          Active Reservations (${filteredBookings.length})
                        </span>
                        <span class="text-xs text-zinc-400">1-Hour Blocks</span>
                      </div>

                      ${filteredBookings.length === 0
                        ? html`
                            <div class="py-12 text-center text-zinc-400 text-xs">
                              No bookings found matching "${searchQuery}".
                            </div>
                          `
                        : html`
                            <!-- Mobile View -->
                            <div class="block md:hidden divide-y divide-zinc-100">
                              ${filteredBookings.map(
                                (b) => html`
                                  <div key=${b.id} class="p-4 space-y-3">
                                    <div class="flex items-center justify-between">
                                      <span class="font-mono font-bold text-xs text-zinc-900 bg-zinc-100 px-2 py-0.5 rounded">
                                        ${b.token}
                                      </span>
                                      <span class="text-xs text-zinc-700 font-medium">${b.machineName}</span>
                                    </div>
                                    <div class="grid grid-cols-2 gap-2 text-xs">
                                      <div>
                                        <span class="text-[10px] text-zinc-400 block uppercase">Student</span>
                                        <span class="font-medium text-zinc-900">${b.studentName}</span>
                                        <span class="text-[11px] text-zinc-500 block">${b.semester}</span>
                                      </div>
                                      <div>
                                        <span class="text-[10px] text-zinc-400 block uppercase">Slot</span>
                                        <span class="font-medium text-zinc-800 block">${formatDateDisplay(b.date)}</span>
                                        <span class="text-[11px] text-zinc-500 block">${b.timeSlot}</span>
                                      </div>
                                    </div>
                                    <div class="flex items-center justify-end space-x-2 pt-1">
                                      <button
                                        onClick=${() => setSuccessModalData(b)}
                                        class="px-3 py-1.5 text-xs font-medium text-zinc-700 bg-zinc-100 rounded-lg"
                                      >
                                        View Slip
                                      </button>
                                      ${isAdmin &&
                                      html`
                                        <button
                                          onClick=${() => {
                                            setEditingBooking(b);
                                            setEditForm({
                                              studentName: b.studentName,
                                              semester: b.semester,
                                              machineId: b.machineId,
                                              date: b.date,
                                              timeSlot: b.timeSlot
                                            });
                                          }}
                                          class="p-1.5 text-indigo-600 bg-indigo-50 rounded-lg"
                                        >
                                          <${PencilIcon} />
                                        </button>
                                        <button
                                          onClick=${() => setDeleteBookingTarget(b)}
                                          class="p-1.5 text-rose-600 bg-rose-50 rounded-lg"
                                        >
                                          <${TrashIcon} />
                                        </button>
                                      `}
                                    </div>
                                  </div>
                                `
                              )}
                            </div>

                            <!-- Desktop Table -->
                            <div class="hidden md:block overflow-x-auto">
                              <table class="w-full text-left text-xs">
                                <thead>
                                  <tr class="bg-zinc-50/75 border-b border-zinc-200/60 text-zinc-500 font-medium">
                                    <th class="py-3 px-4">Token</th>
                                    <th class="py-3 px-4">Machine</th>
                                    <th class="py-3 px-4">Student Name</th>
                                    <th class="py-3 px-4">Semester</th>
                                    <th class="py-3 px-4">Date & Slot</th>
                                    <th class="py-3 px-4 text-right">Actions</th>
                                  </tr>
                                </thead>
                                <tbody class="divide-y divide-zinc-100">
                                  ${filteredBookings.map(
                                    (b) => html`
                                      <tr key=${b.id} class="hover:bg-zinc-50/60 transition">
                                        <td class="py-3.5 px-4 font-mono font-bold text-zinc-900">${b.token}</td>
                                        <td class="py-3.5 px-4 font-medium text-zinc-800">${b.machineName}</td>
                                        <td class="py-3.5 px-4 font-medium text-zinc-900">${b.studentName}</td>
                                        <td class="py-3.5 px-4 text-zinc-600">${b.semester}</td>
                                        <td class="py-3.5 px-4">
                                          <div>${formatDateDisplay(b.date)}</div>
                                          <div class="text-[11px] text-zinc-500">${b.timeSlot}</div>
                                        </td>
                                        <td class="py-3.5 px-4 text-right">
                                          <div class="flex items-center justify-end space-x-1.5">
                                            <button
                                              onClick=${() => setSuccessModalData(b)}
                                              class="px-2.5 py-1 text-[11px] font-medium text-zinc-700 hover:text-zinc-900 bg-zinc-100 hover:bg-zinc-200 rounded-md"
                                            >
                                              Slip
                                            </button>
                                            ${isAdmin &&
                                            html`
                                              <button
                                                onClick=${() => {
                                                  setEditingBooking(b);
                                                  setEditForm({
                                                    studentName: b.studentName,
                                                    semester: b.semester,
                                                    machineId: b.machineId,
                                                    date: b.date,
                                                    timeSlot: b.timeSlot
                                                  });
                                                }}
                                                class="p-1.5 text-zinc-600 hover:text-indigo-600 bg-zinc-100 rounded-md"
                                              >
                                                <${PencilIcon} />
                                              </button>
                                              <button
                                                onClick=${() => setDeleteBookingTarget(b)}
                                                class="p-1.5 text-zinc-600 hover:text-rose-600 bg-zinc-100 rounded-md"
                                              >
                                                <${TrashIcon} />
                                              </button>
                                            `}
                                          </div>
                                        </td>
                                      </tr>
                                    `
                                  )}
                                </tbody>
                              </table>
                            </div>
                          `}
                    </div>
                  </div>
                `}
          </main>

          <!-- MODAL: ADMIN LOGIN -->
          ${showAdminModal &&
          html`
            <div class="fixed inset-0 z-50 flex items-center justify-center bg-zinc-900/40 p-4">
              <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl border border-zinc-200 p-5 space-y-4">
                <div class="flex items-center justify-between">
                  <h3 class="font-semibold text-zinc-900 text-sm">Lab Admin Access</h3>
                  <button onClick=${() => setShowAdminModal(false)} class="text-zinc-400 hover:text-zinc-700">✕</button>
                </div>
                <form onSubmit=${handleAdminLogin} class="space-y-3 text-xs">
                  <div>
                    <label class="block font-medium text-zinc-700 mb-1">Enter Password</label>
                    <input
                      type="password"
                      value=${adminPassword}
                      onInput=${(e) => setAdminPassword(e.target.value)}
                      placeholder="Password"
                      class="w-full min-h-[42px] px-3 rounded-xl border border-zinc-200 focus:outline-none focus:border-zinc-900"
                    />
                    ${adminError && html`<p class="mt-1 text-rose-500">${adminError}</p>`}
                  </div>
                  <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onClick=${() => setShowAdminModal(false)} class="px-3 py-2 bg-zinc-100 rounded-xl">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-zinc-900 text-white rounded-xl font-medium">Unlock</button>
                  </div>
                </form>
              </div>
            </div>
          `}

          <!-- MODAL: ADMIN EDIT BOOKING -->
          ${editingBooking &&
          html`
            <div class="fixed inset-0 z-50 flex items-center justify-center bg-zinc-900/40 p-4">
              <div class="bg-white w-full max-w-md rounded-2xl shadow-xl border border-zinc-200 p-5 space-y-3.5 text-xs max-h-[90vh] overflow-y-auto">
                <div class="flex items-center justify-between pb-2 border-b border-zinc-100">
                  <h3 class="font-semibold text-zinc-900 text-sm">Modify Booking (${editingBooking.token})</h3>
                  <button onClick=${() => setEditingBooking(null)} class="text-zinc-400 hover:text-zinc-700">✕</button>
                </div>
                <form onSubmit=${handleSaveEdit} class="space-y-3">
                  ${editError && html`<p class="text-rose-500">${editError}</p>`}
                  <div>
                    <label class="block font-medium mb-1">Student Name</label>
                    <input
                      type="text"
                      value=${editForm.studentName}
                      onInput=${(e) => setEditForm({ ...editForm, studentName: e.target.value })}
                      class="w-full min-h-[40px] px-3 rounded-xl border border-zinc-200"
                      required
                    />
                  </div>
                  <div>
                    <label class="block font-medium mb-1">Semester</label>
                    <select
                      value=${editForm.semester}
                      onChange=${(e) => setEditForm({ ...editForm, semester: e.target.value })}
                      class="w-full min-h-[40px] px-3 rounded-xl border border-zinc-200 bg-white"
                    >
                      ${SEMESTER_OPTIONS.map((s) => html`<option key=${s} value=${s}>${s}</option>`)}
                    </select>
                  </div>
                  <div>
                    <label class="block font-medium mb-1">Machine</label>
                    <select
                      value=${editForm.machineId}
                      onChange=${(e) => setEditForm({ ...editForm, machineId: e.target.value })}
                      class="w-full min-h-[40px] px-3 rounded-xl border border-zinc-200 bg-white"
                    >
                      ${MACHINES.map((m) => html`<option key=${m.id} value=${m.id}>${m.name}</option>`)}
                    </select>
                  </div>
                  <div>
                    <label class="block font-medium mb-1">Date</label>
                    <input
                      type="date"
                      value=${editForm.date}
                      onInput=${(e) => setEditForm({ ...editForm, date: e.target.value })}
                      class="w-full min-h-[40px] px-3 rounded-xl border border-zinc-200"
                      required
                    />
                  </div>
                  <div>
                    <label class="block font-medium mb-1">1-Hour Slot</label>
                    <select
                      value=${editForm.timeSlot}
                      onChange=${(e) => setEditForm({ ...editForm, timeSlot: e.target.value })}
                      class="w-full min-h-[40px] px-3 rounded-xl border border-zinc-200 bg-white"
                    >
                      ${ONE_HOUR_SLOTS.map((s) => html`<option key=${s} value=${s}>${s}</option>`)}
                    </select>
                  </div>
                  <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onClick=${() => setEditingBooking(null)} class="px-3 py-2 bg-zinc-100 rounded-xl">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-zinc-900 text-white rounded-xl font-medium">Save Changes</button>
                  </div>
                </form>
              </div>
            </div>
          `}

          <!-- MODAL: CONFIRM DELETE -->
          ${deleteBookingTarget &&
          html`
            <div class="fixed inset-0 z-50 flex items-center justify-center bg-zinc-900/40 p-4">
              <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl border border-zinc-200 p-5 space-y-3">
                <h3 class="font-semibold text-zinc-900 text-sm">Delete Booking?</h3>
                <p class="text-xs text-zinc-500">
                  Remove token <strong class="text-zinc-800">${deleteBookingTarget.token}</strong> for ${deleteBookingTarget.studentName}?
                </p>
                <div class="flex justify-end space-x-2 pt-2">
                  <button onClick=${() => setDeleteBookingTarget(null)} class="px-3 py-2 bg-zinc-100 text-xs rounded-xl">Cancel</button>
                  <button onClick=${() => handleDeleteBooking(deleteBookingTarget.id)} class="px-4 py-2 bg-rose-600 text-white text-xs rounded-xl font-medium">Delete</button>
                </div>
              </div>
            </div>
          `}

          <!-- MODAL: DIGITAL SLIP -->
          ${successModalData &&
          html`
            <div class="fixed inset-0 z-50 flex items-center justify-center bg-zinc-900/40 p-4">
              <div class="bg-white w-full max-w-md rounded-2xl shadow-xl border border-zinc-200 p-5 space-y-4">
                <div class="flex items-center justify-between pb-2 border-b border-zinc-100">
                  <div>
                    <h3 class="font-semibold text-zinc-900 text-sm">Reservation Slip</h3>
                    <p class="text-[11px] text-zinc-500">Nitte Institute of Architecture</p>
                  </div>
                  <button onClick=${() => setSuccessModalData(null)} class="text-zinc-400 hover:text-zinc-700">✕</button>
                </div>

                <div class="p-4 bg-zinc-900 text-white rounded-xl text-center space-y-1">
                  <span class="text-[10px] uppercase text-zinc-400 font-mono tracking-wider">Pass Token</span>
                  <div class="text-2xl font-mono font-bold text-amber-400">${successModalData.token}</div>
                  <p class="text-[11px] text-zinc-300">Show this token at the FabLab desk</p>
                </div>

                <div class="grid grid-cols-2 gap-2 text-xs py-2 border-y border-zinc-100">
                  <div>
                    <span class="text-[10px] text-zinc-400 block uppercase">Student</span>
                    <span class="font-medium text-zinc-900">${successModalData.studentName}</span>
                  </div>
                  <div>
                    <span class="text-[10px] text-zinc-400 block uppercase">Semester</span>
                    <span class="font-medium text-zinc-900">${successModalData.semester}</span>
                  </div>
                  <div>
                    <span class="text-[10px] text-zinc-400 block uppercase">Machine</span>
                    <span class="font-medium text-zinc-900">${successModalData.machineName}</span>
                  </div>
                  <div>
                    <span class="text-[10px] text-zinc-400 block uppercase">Date</span>
                    <span class="font-medium text-zinc-900">${formatDateDisplay(successModalData.date)}</span>
                  </div>
                  <div class="col-span-2">
                    <span class="text-[10px] text-zinc-400 block uppercase">Slot</span>
                    <span class="font-semibold text-emerald-700 text-sm">${successModalData.timeSlot}</span>
                  </div>
                </div>

                <div class="flex gap-2">
                  <button onClick=${() => window.print()} class="w-1/2 py-2.5 bg-zinc-100 hover:bg-zinc-200 text-xs font-medium rounded-xl">
                    Print / Save
                  </button>
                  <button onClick=${() => setSuccessModalData(null)} class="w-1/2 py-2.5 bg-zinc-900 hover:bg-zinc-800 text-white text-xs font-medium rounded-xl">
                    Done
                  </button>
                </div>
              </div>
            </div>
          `}

          <!-- FOOTER -->
          <footer class="border-t border-zinc-200 bg-white py-5 mt-10 text-xs text-zinc-500">
            <div class="max-w-6xl mx-auto px-3.5 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-left">
              <span class="font-medium text-zinc-800">Nitte Institute of Architecture (NIA) • Mangaluru</span>
              <span class="text-zinc-400">Room FAB-02 Digital Lab • 08:00 AM – 06:30 PM</span>
            </div>
          </footer>
        </div>
      `;
    }

    render(html`<${App} />`, document.getElementById('root'));
  </script>
</body>
</html>
